[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "retirement-tax-planner-lite"
dynamic = ["version"]
description = "Free, open-source desktop app for marginal and forward-looking tax graphs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.6",
  # PySide6 6.12.0 drops a reference to True/False/None on every Python-side
  # signal emit; Python 3.11 has no immortal objects, so a long session (or the
  # test suite) crashes with "bool_dealloc". Python 3.12+ is unaffected.
  "PySide6!=6.12.0; python_version < '3.12'",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rtpl-chart = "rtpl.cli:main"
rtpl-plan = "rtpl.plan_cli:main"
rtpl-shortcut = "rtpl.app.shortcut:main"

[project.gui-scripts]
rtpl = "rtpl.app.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rtpl = ["data/**/*.toml", "data/icons/*.png", "data/icons/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

# The version lives only in src/rtpl/__init__.py.
[tool.setuptools.dynamic]
version = {attr = "rtpl.__version__"}
