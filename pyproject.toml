[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "retirement-tax-planner-lite"
version = "0.1.0"
description = "Free, open-source desktop app for marginal and forward-looking tax graphs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.6",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
rtpl-chart = "rtpl.cli:main"
rtpl-shortcut = "rtpl.app.shortcut:main"

[project.gui-scripts]
rtpl = "rtpl.app.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rtpl = ["data/**/*.toml", "data/icons/*.png", "data/icons/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
