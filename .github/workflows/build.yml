name: build apps

# Builds the stand-alone app on each OS with PyInstaller, checks that it
# starts, and uploads it as a downloadable artifact.
#
# * Every push to main: fresh builds on the run's page (kept 30 days).
# * A version tag such as v0.2.0: the same builds, attached to a GitHub
#   Release, where they stay for good.
# * Pull requests that touch packaging, and "Run workflow" by hand.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - "src/rtpl/app/**"
      - "src/rtpl/data/icons/**"
      - "pyproject.toml"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('src/rtpl/__init__.py').read())[1])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ $version in src/rtpl/__init__.py"
            exit 1
          fi
      - run: pip install . pyinstaller
      - run: pyinstaller packaging/rtpl.spec --noconfirm
      - name: Start the built app
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          case "$RUNNER_OS" in
            macOS) exe=dist/RetirementTaxPlannerLite.app/Contents/MacOS/RetirementTaxPlannerLite ;;
            Windows) exe=dist/RetirementTaxPlannerLite/RetirementTaxPlannerLite.exe ;;
            *) exe=dist/RetirementTaxPlannerLite/RetirementTaxPlannerLite ;;
          esac
          "$exe" & pid=$!
          sleep 15
          kill -0 $pid   # still running means it started without crashing
          kill $pid || true
      - name: Zip
        shell: bash
        run: |
          # Releases name the file after the version, e.g.
          # RetirementTaxPlannerLite-0.2.0-Windows.zip
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            zip="RetirementTaxPlannerLite-${GITHUB_REF_NAME#v}-$RUNNER_OS.zip"
          else
            zip="RetirementTaxPlannerLite-$RUNNER_OS.zip"
          fi
          cd dist
          if [ "$RUNNER_OS" = macOS ]; then
            ditto -c -k --keepParent RetirementTaxPlannerLite.app "../$zip"
          else
            7z a -r "../$zip" RetirementTaxPlannerLite > /dev/null
          fi
          echo "ZIP=$zip" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: RetirementTaxPlannerLite-${{ runner.os }}
          path: ${{ env.ZIP }}
          retention-days: 30

  # On a version tag, publish the three zips as a GitHub Release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: zips
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release made by hand on GitHub for this tag just gets the zips.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" zips/*.zip --clobber --repo "$GITHUB_REPOSITORY"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" zips/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "RetirementTaxPlannerLite ${GITHUB_REF_NAME#v}" \
            --generate-notes
