name: build apps

# Builds the stand-alone app on each OS with PyInstaller and uploads it as a
# downloadable artifact. Runs when packaging changes, or by hand from the
# Actions tab ("Run workflow").
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "packaging/**"
      - "src/rtpl/app/**"
      - "src/rtpl/data/icons/**"
      - "pyproject.toml"
      - ".github/workflows/build.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install . pyinstaller
      - run: pyinstaller packaging/rtpl.spec --noconfirm
      - name: Start the built app
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          case "$RUNNER_OS" in
            macOS) exe=dist/RetirementTaxPlannerLite.app/Contents/MacOS/RetirementTaxPlannerLite ;;
            Windows) exe=dist/RetirementTaxPlannerLite/RetirementTaxPlannerLite.exe ;;
            *) exe=dist/RetirementTaxPlannerLite/RetirementTaxPlannerLite ;;
          esac
          "$exe" & pid=$!
          sleep 15
          kill -0 $pid   # still running means it started without crashing
          kill $pid || true
      - name: Zip
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = macOS ]; then
            ditto -c -k --keepParent RetirementTaxPlannerLite.app ../RetirementTaxPlannerLite-macOS.zip
          else
            7z a -r ../RetirementTaxPlannerLite-$RUNNER_OS.zip RetirementTaxPlannerLite > /dev/null
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: RetirementTaxPlannerLite-${{ runner.os }}
          path: RetirementTaxPlannerLite-${{ runner.os }}.zip
